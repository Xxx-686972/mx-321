<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微博-消息</title>
    <link rel="stylesheet" href="./1.css">
</head>
<body>
    <div class="top-nav">
        <span>发现群</span>
        <span>动态</span>
        <span class="tab-item active">消息 <span class="badge">25</span></span>
        <div style="display:flex;gap:18px;">
            <img src="./icons/clean.png" width="24">
            <img src="./icons/setting.png" width="24">
        </div>
    </div>

    <div class="msg-item">
        <img class="avatar" src="./icons/at.png">
        <div class="msg-text">
            <h4>@我的</h4>
        </div>
        <span>></span>
    </div>
    <div class="msg-item">
        <img class="avatar" src="./icons/comment.png">
        <div class="msg-text">
            <h4>评论</h4>
        </div>
        <span>></span>
    </div>
    <div class="msg-item">
        <img class="avatar" src="./icons/like.png">
        <div class="msg-text">
            <h4>赞</h4>
        </div>
        <span>></span>
    </div>
    <div class="msg-item">
        <img class="avatar" src="./images/sinanews.png">
        <div class="msg-text">
            <h4>新浪新闻</h4>
            <p>2027国考今起报名，注意事项一文速览</p>
        </div>
        <div>
            <span class="msg-time">09:19</span>
            <span class="badge">13</span>
        </div>
    </div>
    <div class="msg-item">
        <img class="avatar" src="./icons/hotsearch.png">
        <div class="msg-text">
            <h4>热搜简报</h4>
            <p>微博热搜: 红果短剧千万别下载</p>
        </div>
        <div>
            <span class="msg-time">08:52</span>
            <span class="badge">5</span>
        </div>
    </div>

    <!--底部导航-->
    <div class="bottom-nav">
        <a href="index.html">
            <img src="./icons/home.png">
            <span>首页</span>
        </a>
        <a href="video.html">
            <img src="./icons/video.png">
            <span>视频</span>
        </a>
        <a href="search.html">
            <img src="./icons/search.png">
            <span>发现</span>
        </a>
        <a href="message.html" class="active">
            <img src="./icons/msg.png">
            <span>消息</span>
        </a>
        <a href="mine.html">
            <img src="./icons/user.png">
            <span>我</span>
        </a>
    </div>
</body>
</html>
