name: mx_deploy_pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mx-pages
  cancel-in-progress: true
jobs:
  mx_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.mx_deploy_step.outputs.page_url }}
    steps:
      - name: mx_checkout
        uses: actions/checkout@v4
      - name: mx_configure_pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: mx_upload_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: mx_deploy_pages
        id: mx_deploy_step
        uses: actions/deploy-pages@v4
