<!DOCTYPE html>
<!--
  mx_ 作者：孟欣
  mx_ 学号：24002120321
  mx_ 建立时间：2026-11-18
  mx_ 使用大模型：GLM-5.3-FlashX
  mx_ 功能名称：手势滑卡美食卡片（touchstart/touchend 左右滑动切换，40px 阈值 + 300ms 冷却 + 0.3s 过渡）
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>手势滑卡 · 中华美食卡片 · 孟欣 24002120321</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(180deg,#f8fcff 0%,#eaf4fe 60%,#f6fbff 100%);
    background-attachment:fixed;color:#17324a;min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  .mx_page{max-width:480px;margin:0 auto;padding:26px 16px 56px}

  /* mx_ 页头 */
  .mx_head{text-align:center;margin-bottom:20px}
  .mx_head h1{font-size:20px;letter-spacing:2px;font-weight:600;color:#17324a}
  .mx_head p{font-size:12.5px;color:#6b8aa3;margin-top:7px}

  /* mx_ 滑动舞台：只接管横向手势，纵向滚动交还浏览器 */
  .mx_stage{touch-action:pan-y}
  .mx_card{
    position:relative;border-radius:20px;overflow:hidden;height:330px;
    display:flex;flex-direction:column;justify-content:flex-end;
    box-shadow:0 16px 34px rgba(31,106,171,.22);
    transition:transform .3s ease,opacity .3s ease;
    will-change:transform,opacity;user-select:none;-webkit-user-select:none;
  }
  .mx_card::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,0) 34%,rgba(0,0,0,.62) 100%);
  }
  .mx_card-icon{position:absolute;top:28px;left:26px;font-size:46px;opacity:.92}
  .mx_card-body{position:relative;z-index:2;padding:22px 22px 26px;color:#fff}
  .mx_card-name{font-size:25px;font-weight:700;letter-spacing:2px}
  .mx_card-line{width:42px;height:3px;background:rgba(255,255,255,.85);border-radius:2px;margin:11px 0 12px}
  .mx_card-desc{font-size:13.5px;line-height:1.95;color:rgba(255,255,255,.92)}
  .mx_card-tag{
    display:inline-block;margin-top:14px;font-size:11.5px;letter-spacing:1px;
    padding:5px 13px;border-radius:999px;
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.34);
  }
  .mx_counter{
    text-align:center;margin-top:16px;font-size:13.5px;letter-spacing:2px;color:#3d6079;
    font-variant-numeric:tabular-nums;
  }
  .mx_counter b{color:#e8890c;font-size:16px}
  .mx_dots{display:flex;gap:7px;justify-content:center;margin-top:10px}
  .mx_dot{width:7px;height:7px;border-radius:50%;background:#c3d8ec;transition:all .3s}
  .mx_dot.mx_dot--on{background:#e8890c;width:19px;border-radius:4px}

  /* mx_ 实现要点说明 */
  .mx_note{
    margin-top:22px;background:#fff;border:1px solid #d9e9f8;border-radius:14px;
    padding:15px 17px;font-size:12.6px;color:#31506b;line-height:2.05;
    box-shadow:0 6px 16px rgba(59,143,212,.08);
  }
  .mx_note b{color:#1f6aab}
  .mx_note code{background:#eaf3fd;color:#1f6aab;border-radius:4px;padding:1px 6px;font-family:Consolas,monospace;font-size:11.8px}

  /* mx_ 通用提示条（边界提示） */
  .mx_toast{
    position:fixed;left:50%;bottom:52px;transform:translate(-50%,14px);
    background:rgba(23,50,74,.88);color:#fff;font-size:12.5px;letter-spacing:1px;
    padding:9px 19px;border-radius:999px;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9;
  }
  .mx_toast.mx_toast--on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
  <div class="mx_page">
    <div class="mx_head">
      <h1>手势滑卡 · 中华美食</h1>
      <p>孟欣 24002120321 · 手指左右滑动切换菜品</p>
    </div>

    <!-- mx_ 滑动区域：touchstart/touchend 判定横向位移 -->
    <div class="mx_stage" id="mx_gStage">
      <div class="mx_card" id="mx_gCard">
        <div class="mx_card-icon" id="mx_gIcon">🍲</div>
        <div class="mx_card-body">
          <div class="mx_card-name" id="mx_gName">菜名</div>
          <div class="mx_card-line"></div>
          <div class="mx_card-desc" id="mx_gDesc">简介</div>
          <div class="mx_card-tag" id="mx_gTag">标签</div>
        </div>
      </div>
    </div>

    <div class="mx_counter" id="mx_gCounter">第 <b>1</b>/4 张</div>
    <div class="mx_dots" id="mx_gDots"></div>

    <div class="mx_note">
      <b>实现要点：</b>用 <code>changedTouches[0]</code> 计算横向位移，阈值 40px 过滤抖动；左滑下一张、右滑上一张，边界弹提示；容器 <code>touch-action: pan-y</code> 保证纵向还能滚页面；切换带 0.3s 过渡，300ms 冷却防连滑一次跳两张。
    </div>
  </div>

  <div class="mx_toast" id="mx_toast"></div>

<script>
  /* mx_ 4 道菜数据：菜名 / 简介 / 渐变背景 / 图标 / 标签 */
  var mx_gDishes = [
    { name:'宫保鸡丁', desc:'鸡丁滑嫩、花生碎酥，干辣椒与花椒在热油里爆出糊辣香，酸甜咸鲜一口到位。', tag:'川菜 · 糊辣荔枝味', icon:'🍗', bg:'linear-gradient(135deg,#f7971e 0%,#ffb347 42%,#e2542c 100%)' },
    { name:'清蒸鲈鱼', desc:'整条鲈鱼大火八分钟，出锅淋豉油、铺姜丝葱段，热油一激，只留最本真的鲜。', tag:'粤菜 · 原汁原味', icon:'🐟', bg:'linear-gradient(135deg,#2bc0e4 0%,#3f8ce8 46%,#1f4a8a 100%)' },
    { name:'麻婆豆腐', desc:'嫩豆腐在红汤里颤，牛肉臊子、郫县豆瓣、花椒面三重叠加，麻在前辣在后。', tag:'川菜 · 麻辣烫嫩', icon:'🌶️', bg:'linear-gradient(135deg,#e94e77 0%,#c0392b 54%,#7b1f1f 100%)' },
    { name:'蟹粉小笼', desc:'薄皮十八褶，咬开先吸一口滚烫汤汁，蟹粉与猪肉的油脂在舌尖化开。', tag:'苏式点心 · 一咬一包汤', icon:'🥟', bg:'linear-gradient(135deg,#f6d365 0%,#fda085 52%,#c9694a 100%)' }
  ];
  var mx_gIndex = 0;       /* mx_ 当前第几张（0 起） */
  var mx_gStartX = 0;      /* mx_ touchstart 记录的横坐标 */
  var mx_gLocked = false;  /* mx_ 冷却锁 */
  var mx_gThreshold = 40;  /* mx_ 滑动判定阈值（px） */
  var mx_gCooldown = 300;  /* mx_ 冷却时长（ms） */

  /**
   * mx_ 主要功能：把当前菜的菜名/简介/标签/图标/渐变写进卡片，并同步计数与圆点；
   * 做一次 0.3s 进场过渡（先挪到一侧，再还原触发 transition）
   */
  function mx_renderDish(mx_dir) {
    var mx_item = mx_gDishes[mx_gIndex];
    var mx_card = document.getElementById('mx_gCard');

    document.getElementById('mx_gName').textContent = mx_item.name;
    document.getElementById('mx_gDesc').textContent = mx_item.desc;
    document.getElementById('mx_gTag').textContent = mx_item.tag;
    document.getElementById('mx_gIcon').textContent = mx_item.icon;
    mx_card.style.background = mx_item.bg;

    document.getElementById('mx_gCounter').innerHTML = '第 <b>' + (mx_gIndex + 1) + '</b>/' + mx_gDishes.length + ' 张';
    var mx_dots = document.getElementById('mx_gDots');
    mx_dots.innerHTML = '';
    for (var mx_i = 0; mx_i < mx_gDishes.length; mx_i++) {
      var mx_dot = document.createElement('span');
      mx_dot.className = 'mx_dot' + (mx_i === mx_gIndex ? ' mx_dot--on' : '');
      mx_dots.appendChild(mx_dot);
    }

    mx_card.style.transition = 'none';
    mx_card.style.transform = 'translateX(' + (mx_dir * 46) + 'px) scale(.96)';
    mx_card.style.opacity = '0.25';
    mx_card.offsetHeight;   /* mx_ 强制重排，让起始状态立即生效 */
    mx_card.style.transition = 'transform .3s ease, opacity .3s ease';
    mx_card.style.transform = 'translateX(0) scale(1)';
    mx_card.style.opacity = '1';
  }

  /**
   * mx_ 主要功能：底部弹出提示文字（边界提示），1.4 秒后自动淡出
   */
  function mx_showTip(mx_text) {
    var mx_toast = document.getElementById('mx_toast');
    mx_toast.textContent = mx_text;
    mx_toast.classList.add('mx_toast--on');
    clearTimeout(mx_showTip.mx_timer);
    mx_showTip.mx_timer = setTimeout(function () {
      mx_toast.classList.remove('mx_toast--on');
    }, 1400);
  }

  /**
   * mx_ 主要功能：记录手指按下的横向起点，供 touchend 计算位移
   */
  function mx_onGestureStart(mx_e) {
    mx_gStartX = mx_e.changedTouches[0].clientX;
  }

  /**
   * mx_ 主要功能：算横向位移（左滑负、右滑正），超 40px 才翻卡；
   * 冷却中忽略；到头或到尾只弹提示不切换
   */
  function mx_onGestureEnd(mx_e) {
    if (mx_gLocked) { return; }
    var mx_dx = mx_e.changedTouches[0].clientX - mx_gStartX;
    if (Math.abs(mx_dx) < mx_gThreshold) { return; }  /* mx_ 小于阈值视为误触 */

    if (mx_dx < 0) {
      if (mx_gIndex >= mx_gDishes.length - 1) { mx_showTip('已经是最后一张'); return; }
      mx_gIndex++;
      mx_renderDish(1);
    } else {
      if (mx_gIndex <= 0) { mx_showTip('已经是第一张'); return; }
      mx_gIndex--;
      mx_renderDish(-1);
    }

    mx_gLocked = true;   /* mx_ 上锁，防止一次连滑跳两张 */
    setTimeout(function () { mx_gLocked = false; }, mx_gCooldown);
  }

  /* mx_ touchstart 记录起点，touchend 用 changedTouches[0] 判定方向与距离 */
  document.getElementById('mx_gStage').addEventListener('touchstart', mx_onGestureStart, { passive:true });
  document.getElementById('mx_gStage').addEventListener('touchend', mx_onGestureEnd, { passive:true });

  /* mx_ 初始化：渲染第一张卡 */
  mx_renderDish(1);
</script>
</body>
</html>
