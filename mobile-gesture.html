<!DOCTYPE html>
<!--
  mx_ 作者：孟欣
  mx_ 学号：24002120321
  mx_ 建立时间：2026-11-18
  mx_ 使用大模型：DeepSeek-V4.1-Flash
  mx_ 功能名称：移动端手势滑卡——美食卡片左右滑动切换（40px 阈值 / 边界提示 / 0.3s 过渡 / 300ms 冷却）
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>美食卡片 · 左右滑动切换</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:#12161f;color:#fff;-webkit-font-smoothing:antialiased;
  }
  .mx_page{max-width:520px;margin:0 auto;padding:26px 18px 60px;min-height:100vh}

  /* mx_ 页头 */
  .mx_head{text-align:center;margin-bottom:22px}
  .mx_head h1{font-size:20px;letter-spacing:2px;font-weight:600}
  .mx_head p{font-size:12.5px;color:#8b94a7;margin-top:8px;line-height:1.9}

  /* mx_ 卡片舞台：touch-action: pan-y 保证纵向滚动仍交给浏览器 */
  .mx_stage{
    touch-action:pan-y;
    perspective:900px;
  }

  /* mx_ 卡片本体：0.3s 过渡用在 transform 与 opacity 上 */
  .mx_card{
    position:relative;border-radius:22px;overflow:hidden;
    height:380px;display:flex;flex-direction:column;justify-content:flex-end;
    box-shadow:0 22px 48px rgba(0,0,0,.45);
    transition:transform .3s ease,opacity .3s ease;
    will-change:transform,opacity;
    user-select:none;-webkit-user-select:none;
  }
  .mx_card::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,0) 34%,rgba(0,0,0,.62) 100%);
  }

  /* mx_ 卡片内容 */
  .mx_card-icon{position:absolute;top:34px;left:30px;font-size:52px;opacity:.92}
  .mx_card-body{position:relative;z-index:2;padding:26px 26px 30px}
  .mx_card-name{font-size:27px;font-weight:700;letter-spacing:2px}
  .mx_card-line{width:44px;height:3px;background:rgba(255,255,255,.85);border-radius:2px;margin:12px 0 14px}
  .mx_card-desc{font-size:14px;line-height:2;color:rgba(255,255,255,.92)}
  .mx_card-tag{
    display:inline-block;margin-top:16px;font-size:12px;letter-spacing:1px;
    padding:5px 14px;border-radius:999px;
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.34);
  }

  /* mx_ 底部计数「第 1/4 张」 */
  .mx_counter{
    text-align:center;margin-top:22px;font-size:14px;letter-spacing:2px;
    color:#cfd6e4;font-variant-numeric:tabular-nums;
  }
  .mx_counter b{color:#ffd166;font-size:17px}
  .mx_dots{display:flex;gap:8px;justify-content:center;margin-top:12px}
  .mx_dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.26);transition:all .3s}
  .mx_dot.mx_dot--on{background:#ffd166;width:20px;border-radius:4px}

  /* mx_ 操作提示 */
  .mx_hint{text-align:center;font-size:12.5px;color:#6f7a90;line-height:2;margin-top:26px}

  /* mx_ 边界提示 toast */
  .mx_toast{
    position:fixed;left:50%;bottom:64px;transform:translate(-50%,14px);
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);
    backdrop-filter:blur(10px);color:#fff;font-size:13px;letter-spacing:1px;
    padding:9px 20px;border-radius:999px;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  }
  .mx_toast.mx_toast--on{opacity:1;transform:translate(-50%,0)}

  /* mx_ 纵向滚动内容：验证 pan-y 仍然生效 */
  .mx_scroll{margin-top:40px}
  .mx_scroll h2{font-size:14px;color:#ffd166;letter-spacing:1px;margin-bottom:12px}
  .mx_scroll p{font-size:13px;color:#8b94a7;line-height:2.1;margin-bottom:14px}
</style>
</head>
<body>
  <div class="mx_page">
    <div class="mx_head">
      <h1>今日推荐 · 四道菜</h1>
      <p>左右滑动卡片切换　·　上下滑动仍可滚动本页</p>
    </div>

    <!-- mx_ 卡片舞台：绑定触摸事件，touch-action:pan-y -->
    <div class="mx_stage" id="mxStage">
      <div class="mx_card" id="mxCard">
        <div class="mx_card-icon" id="mxIcon">🍲</div>
        <div class="mx_card-body">
          <div class="mx_card-name" id="mxName">菜名</div>
          <div class="mx_card-line"></div>
          <div class="mx_card-desc" id="mxDesc">简介</div>
          <div class="mx_card-tag" id="mxTag">标签</div>
        </div>
      </div>
    </div>

    <!-- mx_ 底部计数 -->
    <div class="mx_counter" id="mxCounter">第 <b>1</b>/4 张</div>
    <div class="mx_dots" id="mxDots"></div>

    <div class="mx_hint">
      左滑 → 下一道菜　|　右滑 → 上一道菜<br>
      手势位移需超过 40px 才判定为滑动，连滑有 300ms 冷却
    </div>

    <!-- mx_ 纵向滚动区：用来验证 pan-y -->
    <div class="mx_scroll">
      <h2>为什么加 touch-action: pan-y</h2>
      <p>卡片舞台只接管「横向」手势，把「纵向」手势还给浏览器。这样用户上下滑页面时不会被卡片拦住，只有明显左右移动才被判成翻卡。</p>
      <p>判断阈值设为 40px，是为了过滤手指轻微抖动；300ms 冷却则是防止一次快速连滑触发两次切换、一次跳过两张。</p>
      <p>继续向下滑，页面可以正常滚动到这里，说明 pan-y 生效。</p>
    </div>
  </div>

  <!-- mx_ 边界提示条 -->
  <div class="mx_toast" id="mxToast"></div>

<script>
  /* mx_ 四道菜数据：菜名、简介、渐变背景、图标 */
  var mx_dishes = [
    {
      name: '宫保鸡丁',
      desc: '鸡丁滑嫩、花生碎酥，干辣椒与花椒在热油里爆出糊辣香，酸甜咸鲜一口到位。',
      tag: '川菜 · 糊辣荔枝味',
      icon: '🍗',
      bg: 'linear-gradient(135deg,#f7971e 0%,#ffb347 42%,#e2542c 100%)'
    },
    {
      name: '清蒸鲈鱼',
      desc: '整条鲈鱼大火八分钟，出锅淋豉油、铺姜丝葱段，热油一激，只留最本真的鲜。',
      tag: '粤菜 · 原汁原味',
      icon: '🐟',
      bg: 'linear-gradient(135deg,#2bc0e4 0%,#3f8ce8 46%,#1f4a8a 100%)'
    },
    {
      name: '麻婆豆腐',
      desc: '嫩豆腐在红汤里颤，牛肉臊子、郫县豆瓣、花椒面三重叠加，麻在前辣在后。',
      tag: '川菜 · 麻辣烫嫩',
      icon: '🌶️',
      bg: 'linear-gradient(135deg,#e94e77 0%,#c0392b 54%,#7b1f1f 100%)'
    },
    {
      name: '蟹粉小笼',
      desc: '薄皮十八褶，咬开先吸一口滚烫汤汁，蟹粉与猪肉的油脂在舌尖化开。',
      tag: '苏式点心 · 一咬一包汤',
      icon: '🥟',
      bg: 'linear-gradient(135deg,#f6d365 0%,#fda085 52%,#c9694a 100%)'
    }
  ];

  var mx_index = 0;        /* mx_ 当前第几张（0 起） */
  var mx_startX = 0;       /* mx_ touchstart 记录的横坐标 */
  var mx_locked = false;   /* mx_ 冷却锁：true 时忽略新手势 */
  var mx_threshold = 40;   /* mx_ 判定为滑动的位移阈值（px） */
  var mx_cooldown = 300;   /* mx_ 冷却时长（ms），防止一次连滑跳两张 */

  /**
   * mx_ 主要功能：按当前索引把菜名、简介、标签、图标、渐变背景写进卡片，并同步计数与圆点
   * @param {number} mx_dir 进场方向：1 表示从右侧进（左滑后），-1 表示从左侧进（右滑后）
   */
  function mx_renderCard(mx_dir) {
    var mx_item = mx_dishes[mx_index];
    var mx_card = document.getElementById('mxCard');

    document.getElementById('mxName').textContent = mx_item.name;
    document.getElementById('mxDesc').textContent = mx_item.desc;
    document.getElementById('mxTag').textContent = mx_item.tag;
    document.getElementById('mxIcon').textContent = mx_item.icon;
    mx_card.style.background = mx_item.bg;

    /* mx_ 计数与圆点 */
    document.getElementById('mxCounter').innerHTML = '第 <b>' + (mx_index + 1) + '</b>/' + mx_dishes.length + ' 张';
    var mx_dots = document.getElementById('mxDots');
    mx_dots.innerHTML = '';
    for (var mx_i = 0; mx_i < mx_dishes.length; mx_i++) {
      var mx_dot = document.createElement('span');
      mx_dot.className = 'mx_dot' + (mx_i === mx_index ? ' mx_dot--on' : '');
      mx_dots.appendChild(mx_dot);
    }

    /* mx_ 0.3s 进场过渡：先无动画地把卡片挪到一侧，再还原到 0 触发 transition */
    mx_card.style.transition = 'none';
    mx_card.style.transform = 'translateX(' + (mx_dir * 46) + 'px) scale(.96)';
    mx_card.style.opacity = '0.25';
    mx_card.offsetHeight; /* mx_ 强制浏览器重排，让上面的起始状态立即生效 */
    mx_card.style.transition = 'transform .3s ease, opacity .3s ease';
    mx_card.style.transform = 'translateX(0) scale(1)';
    mx_card.style.opacity = '1';
  }

  /**
   * mx_ 主要功能：在页面底部弹出提示文字（如「已经是第一张」），1.4 秒后自动淡出
   */
  function mx_showToast(mx_text) {
    var mx_toast = document.getElementById('mxToast');
    mx_toast.textContent = mx_text;
    mx_toast.classList.add('mx_toast--on');
    clearTimeout(mx_showToast.mx_timer);
    mx_showToast.mx_timer = setTimeout(function () {
      mx_toast.classList.remove('mx_toast--on');
    }, 1400);
  }

  /**
   * mx_ 主要功能：记录手指按下的横向起点坐标，供 touchend 计算位移
   */
  function mx_onTouchStart(mx_e) {
    mx_startX = mx_e.changedTouches[0].clientX;
  }

  /**
   * mx_ 主要功能：计算横向位移（左滑为负、右滑为正），超过 40px 判定为翻卡；
   * 冷却中直接忽略；到头或到尾时只弹提示不切换
   */
  function mx_onTouchEnd(mx_e) {
    if (mx_locked) { return; }

    var mx_dx = mx_e.changedTouches[0].clientX - mx_startX;
    if (Math.abs(mx_dx) < mx_threshold) { return; } /* mx_ 小于阈值视为误触，不翻卡 */

    if (mx_dx < 0) {
      /* mx_ 左滑：下一张 */
      if (mx_index >= mx_dishes.length - 1) {
        mx_showToast('已经是最后一张');
        return;
      }
      mx_index++;
      mx_renderCard(1);
    } else {
      /* mx_ 右滑：上一张 */
      if (mx_index <= 0) {
        mx_showToast('已经是第一张');
        return;
      }
      mx_index--;
      mx_renderCard(-1);
    }

    /* mx_ 切完立刻上锁，300ms 后再解锁，防止快速连滑一次跳两张 */
    mx_locked = true;
    setTimeout(function () { mx_locked = false; }, mx_cooldown);
  }

  /* mx_ 绑定触摸事件并渲染第一张 */
  document.getElementById('mxStage').addEventListener('touchstart', mx_onTouchStart, { passive: true });
  document.getElementById('mxStage').addEventListener('touchend', mx_onTouchEnd, { passive: true });
  mx_renderCard(1);
</script>
</body>
</html>
