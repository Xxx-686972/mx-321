<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抓小球游戏|函数前三个方法的应用</title>
    <style>
        body {
           background: #f0f0f0;
           overflow: hidden;
           font-size: 24px;
        }
        #info {
            padding: 16px;
            background: #222;
            color: #fff;
        }
        .ball {
            width: 50px;
            height: 50px;
            background: red;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="info">当前分数：<span id="score">0</span></div>
    <div class="ball" id="ball"></div>

    <script>
        // const是常量指的是变量的引用地址不能变，不是对象里的数据不能变。
        const game={
            score:0,
            ballDom:document.getElementById("ball"),// DOM对象
            width:50,
            height:50,
        };
        //需要函数：小球移动，小球点击，空白区域点击，分数更新，小球位置更新
        // 问题：如果不减去小球的宽度，直接写 Math.random() * window.innerWidth 会怎么样？
        // 小球右半部分会跑出浏览器可视区域，出现一半小球在屏幕外看不见。
        function moveBall() {
            //保证小球在屏幕内
            const maxX = window.innerWidth - game.width;
            const maxY = window.innerHeight - game.height;
            //小球的随机位置0——窗口宽度取整
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            //移动小球
            game.ballDom.style.left = randomX + "px";
            game.ballDom.style.top = randomY + "px";
        }
        // 更新分数
        // 普通的函数存在函数提升：函数体在后面，函数调用在前面，
        // 有this,arguments，arguments是一个类数组对象，函数在调用时传递过来的实参数字对象。
         function updateScore(){
        // function updateScore(a,b)
        // a是当前分数，b是增加的分数
            document.getElementById("score").innerText = game.score;
        }
        
        game.ballDom.addEventListener("click", function (e) {
            // 匿名函数有this，this指向当前点击的DOM,（.ball）
            game.score+=10;
            updateScore();//函数调用
            moveBall();
            e.stopPropagation(); //阻止事件冒泡
        });
        // 点击空白区域扣分
        document.body.addEventListener("click", function (e) {
            game.score-=1
            updateScore();
        });
    </script>
</body>
</html>
