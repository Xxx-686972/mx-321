<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>svg图标</title>
    <script src="./iconfont.js"></script>
    <link rel="stylesheet" href="./css/svg.css">
</head>
<body>
    <h3>svg图标</h3>
    <div class="tab-nav">
    <div class="tab-item" onclick="changeTab(this)">
    <svg class="icon" aria-hidden="true">
        <use xlink:href="#icon-shouye"></use></svg>
·   <span>首页</span>
<div class="budge-dot" id="budge-home"></div>
    </div>
    <div class="tab-item" onclick="changeTab(this)">
    <svg class="icon" aria-hidden="true">
        <use xlink:href="#icon-xiaoxi"></use></svg>
·   <span>消息</span>
<div class="budge-num" id="budge-plan">6</div>
    </div>
    <div class="tab-item" onclick="changeTab(this)">
    <svg class="icon" aria-hidden="true">
        <use xlink:href="#icon-gerenzhongxin"></use></svg>
·   <span>个人中心</span>
<div class="budge-dot" id="budge-home"></div>
    </div>
   <div class="tab-item" onclick="changeTab(this)">
    <svg class="icon" aria-hidden="true">
        <use xlink:href="#icon-gengduo"></use></svg>
·   <span>更多</span>
<div class="budge-num max" id="budge-my">100+</div>
    </div>
    </div>
    <script>
        //写一个函数，当点击当前的item时，颜色发生变化
        function changeTab(current){
       let tabs = document.querySelectorAll(".tab-item");
        for (let i = 0; i < tabs.length; i++) {
    tabs[i].classList.remove("active");
    }
    current.classList.add("active");
        }
    </script>
</body>

</html>
